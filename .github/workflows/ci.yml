# 푸시·PR마다 테스트를 돌림. 원본 파일은 저장소에 없으므로 원본 회귀 테스트는 건너뛰고,
# 정제 함수·결합 규칙·검증 게이트·개인정보(processed)·저장소 위생 테스트가 돎.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - name: 패키지 설치
        run: pip install -r requirements-pipeline.txt
      - name: 테스트
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -W error -rs
